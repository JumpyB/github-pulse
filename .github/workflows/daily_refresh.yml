name: Daily dbt Refresh

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      event_date:
        description: 'Date to process (YYYY-MM-DD). Default: yesterday.'
        required: false

jobs:
  dbt_refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dbt dependencies
        run: uv sync

      - name: Set event date
        run: |
          if [ -n "${{ github.event.inputs.event_date }}" ]; then
            echo "EVENT_DATE=${{ github.event.inputs.event_date }}" >> $GITHUB_ENV
          else
            echo "EVENT_DATE=$(date -u -d 'yesterday' '+%Y-%m-%d')" >> $GITHUB_ENV
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: dbt snapshot
        run: uv run dbt snapshot --vars "{\"default_event_date\": \"$EVENT_DATE\"}"

      - name: dbt run
        run: uv run dbt run --vars "{\"default_event_date\": \"$EVENT_DATE\"}"

      - name: dbt test
        run: uv run dbt test --vars "{\"default_event_date\": \"$EVENT_DATE\"}"