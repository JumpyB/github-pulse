name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dbt_ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dbt dependencies
        run: uv sync

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Generate profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          github_pulse:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: oauth
                project: github-pulse-jumpy
                dataset: github_pulse_analytics_dev
                threads: 4
                location: US
                timeout_seconds: 300
          EOF

      - name: Install dbt packages
        run: uv run dbt deps

      - name: dbt compile
        run: uv run dbt compile

      - name: dbt test (source quality checks — warn only)
        run: uv run dbt test --select source:github_archive
        continue-on-error: true

      - name: dbt test (model tests — must pass)
        run: uv run dbt test --exclude source:github_archive