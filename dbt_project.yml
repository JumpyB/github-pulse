name: 'github_pulse'
version: '1.0.0'
config-version: 2

profile: 'github_pulse'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  github_pulse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      core:
        +schema: core
      pull_requests:
        +schema: marts
      engagement:
        +schema: marts
      lifecycle:
        +schema: marts

snapshots:
  github_pulse:
    +target_schema: snapshots
    +strategy: timestamp
    +updated_at: snapshot_loaded_at

vars:
  default_event_date: '2026-04-28'